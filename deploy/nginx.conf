# Static Flutter web build plus the sync API under /api/. Only reachable
# through the Tailscale sidecar, which shares this container's network
# namespace with `api` (ADR-0012).

# The API's responses must never be cached; the static files revalidate.
# (This file is included in the http context, so `map` is allowed here.)
map $uri $nutrimezzo_cache_control {
    ~^/api/  "no-store";
    default  "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Headers live only at server level: any add_header inside a location
    # would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Flutter output (main.dart.js, flutter_bootstrap.js, flutter_service_worker.js,
    # index.html, version.json, manifest.json, assets) is not content-hashed.
    # Always revalidate via ETag so a redeploy never mixes old and new files.
    # /api/ gets no-store instead (see the map above).
    add_header Cache-Control $nutrimezzo_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sync API (server/), listening on loopback in the same namespace. Never
    # falls through to the SPA fallback: unknown /api/ paths are the API's 404.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API sends its own Cache-Control: no-store; drop it so the
        # server-level add_header is the only one.
        proxy_hide_header Cache-Control;
        # Same limit as the server; nginx answers 413 first.
        client_max_body_size 10m;
        proxy_read_timeout 30s;
        gzip_proxied any;
    }

    location = /api {
        return 404;
    }
}
