# Static Flutter web build. Only reachable through the Tailscale sidecar,
# which shares this container's network namespace (ADR-0012).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Headers live only at server level: any add_header inside a location
    # would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Flutter output (main.dart.js, flutter_bootstrap.js, flutter_service_worker.js,
    # index.html, version.json, manifest.json, assets) is not content-hashed.
    # Always revalidate via ETag so a redeploy never mixes old and new files.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
