name: nutrimezzo
description: "Diario local de calorías y macros"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  animations: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExpanded-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArchivoExpanded-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

# `mise exec -- dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/marca/icono_1024.png
  adaptive_icon_background: "#F6F0E4"
  adaptive_icon_foreground: assets/marca/icono_frente.png
  adaptive_icon_monochrome: assets/marca/icono_mono.png

# `mise exec -- dart run flutter_native_splash:create`
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#F6F0E4"
  image: assets/marca/splash.png
  color_dark: "#141A16"
  image_dark: assets/marca/splash_noche.png
  android_12:
    color: "#F6F0E4"
    image: assets/marca/splash_android12.png
    color_dark: "#141A16"
    image_dark: assets/marca/splash_android12_noche.png
