# NutriMezzo web + sync API, reachable only inside the tailnet (ADR-0012).
#
# Three services, one network namespace: `app` (nginx on 127.0.0.1:8080) and
# `api` (the sync server on 127.0.0.1:8081) both join the `tailscale`
# container's namespace, and Tailscale Serve proxies
# https://nutrimezzo.<tailnet>.ts.net -> 127.0.0.1:8080. nginx forwards /api/
# to 127.0.0.1:8081; the API is not published anywhere else. No `ports:`
# anywhere: nothing listens on the host's public interfaces.
#
# The diary lives in one SQLite file on the `nutrimezzo-data` volume
# (/data/nutrimezzo.db inside `api`). Back it up online with:
#   docker compose exec api sqlite3 /data/nutrimezzo.db ".backup /data/backup.db"
#
#   cp .env.example .env   # set TS_AUTHKEY
#   docker compose up -d --build

name: nutrimezzo

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: nutrimezzo
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking: no NET_ADMIN, no /dev/net/tun.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      # e.g. --advertise-tags=tag:nutrimezzo
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  api:
    build: ./server
    image: nutrimezzo-api:local
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      NUTRIMEZZO_DB: /data/nutrimezzo.db
      HOST: 127.0.0.1
      PORT: "8081"
    volumes:
      - nutrimezzo-data:/data
    healthcheck:
      # The runtime image has no curl/wget: the binary checks /api/salud itself.
      test: ["CMD", "/app/bin/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 10s

  app:
    build: .
    image: nutrimezzo-web:local
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  tailscale-state:
  nutrimezzo-data:
